[project]
name = "crm-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0", #database schema migrations
    "asyncpg>=0.32.0", #PostgreSQL driver for async Python
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.142.2",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pydantic-settings>=2.15.0", # Model Validation
    "pyjwt>=2.10,<3.0",
    "scalar-fastapi>=1.9.1", # API Doc
    "sqlalchemy[asyncio]>=2.1.3", # database abstraction/ORM and transaction management
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
